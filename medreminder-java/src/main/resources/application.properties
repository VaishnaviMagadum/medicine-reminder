server.port=8080

# Application Name
spring.application.name=medreminder-java

# ========================================================
# SQL DATABASE CONFIGURATION (Default: File-based SQL database)
# Persists data to a local file in ./data/medreminder
# ========================================================
spring.datasource.url=jdbc:h2:file:./data/medreminder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console to view raw SQL tables in browser at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ========================================================
# (OPTIONAL) MYSQL CONFIGURATION:
# Uncomment below lines to use MySQL instead of H2!
# ========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/medreminder?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Secret Key (Must be at least 256 bits / 32 characters)
jwt.secret=medreminder_secret_key_123_very_secure_spring_boot_token_key_2026
jwt.expiration=604800000

